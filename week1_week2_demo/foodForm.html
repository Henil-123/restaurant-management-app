<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Management - Week 1 & 2 Demo</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>🍽️ Restaurant Food Item Manager</h1>
      <p>Week 1 & Week 2 Standalone HTML/CSS/JS CRUD Demo</p>
    </header>

    <main class="main-content">
      <!-- Week 1: Food Entry Form -->
      <section class="card form-card">
        <h2>Add Food Item</h2>
        <form id="foodForm">
          <div class="form-group">
            <label for="foodName">Food Name <span class="required">*</span></label>
            <input type="text" id="foodName" placeholder="e.g. Paneer Butter Masala" required>
            <small class="error-msg" id="nameError"></small>
          </div>

          <div class="form-group">
            <label for="foodPrice">Price ($) <span class="required">*</span></label>
            <input type="number" id="foodPrice" step="0.01" min="0" placeholder="e.g. 12.99" required>
            <small class="error-msg" id="priceError"></small>
          </div>

          <div class="form-group">
            <label for="foodCategory">Category <span class="required">*</span></label>
            <select id="foodCategory" required>
              <option value="">-- Select Category --</option>
              <option value="Starters">Starters</option>
              <option value="Main Course">Main Course</option>
              <option value="Desserts">Desserts</option>
              <option value="Beverages">Beverages</option>
              <option value="Fast Food">Fast Food</option>
            </select>
            <small class="error-msg" id="categoryError"></small>
          </div>

          <div class="form-group">
            <label for="foodDescription">Description</label>
            <textarea id="foodDescription" rows="3" placeholder="Short description of ingredients or taste..."></textarea>
          </div>

          <div class="form-actions">
            <button type="submit" id="saveBtn" class="btn btn-primary">➕ Add Food Item</button>
            <button type="button" id="resetBtn" class="btn btn-secondary">🔄 Reset</button>
          </div>
        </form>
      </section>

      <!-- Week 2: JavaScript Table View -->
      <section class="card table-card">
        <div class="table-header">
          <h2>Food Inventory (<span id="itemCount">0</span>)</h2>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
          </div>
        </div>

        <div class="table-responsive">
          <table class="data-table" id="foodTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price ($)</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="foodTableBody">
              <!-- Dynamically populated via JS -->
            </tbody>
          </table>
          <div id="emptyState" class="empty-state">
            <p>No food items added yet. Use the form on the left to add items!</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
